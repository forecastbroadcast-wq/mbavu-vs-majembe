<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mbavu vs Majembe Fight Arena</title>
<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: #111;
    color:white;
    text-align:center;
}

header{
    background: url('https://i.ibb.co/wZYgXc0L/your-image-name.jpg') no-repeat center center/cover;
    height: 50vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-shadow:2px 2px 10px black;
}

header h1{
    font-size:3rem;
}

.container{
    padding:30px;
    max-width:900px;
    margin:auto;
}

video{
    width:100%;
    max-width:900px;
    border: 3px solid #e50914;
    border-radius:10px;
    margin-top:20px;
}

.vote-buttons{
    margin-top:20px;
}

.vote-buttons button{
    padding:15px 25px;
    margin:10px;
    background:#e50914;
    border:none;
    color:white;
    font-size:18px;
    cursor:pointer;
    border-radius:6px;
    transition:0.3s;
}

.vote-buttons button:hover{
    background:#ff2a2a;
}

.share-btn{
    position:fixed;
    bottom:20px;
    right:20px;
    padding:12px 20px;
    background:green;
    border:none;
    color:white;
    font-size:16px;
    cursor:pointer;
    border-radius:50px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
}

#vote-message{
    margin-top:15px;
    font-size:1.2rem;
    color:#ffcc00;
    min-height:1.5em;
}

/* Voting animation */
.vote-anim{
    animation: pop 0.4s ease-out;
}

@keyframes pop{
    0% { transform: scale(1); color:#ffcc00; }
    50% { transform: scale(1.5); color:#fff; }
    100% { transform: scale(1); color:#ffcc00; }
}

@media(max-width:600px){
    header h1{font-size:2rem;}
    .vote-buttons button{padding:12px 18px;font-size:16px;}
}
</style>
</head>
<body>

<header>
<h1>🔥 MBAVU VS MAJEMBE 🔥</h1>
</header>

<div class="container">
<p>Welcome to the fight arena! Watch, vote, and share your favorite fighter!</p>

<!-- Fight Video -->
<video controls>
  <source src="https://youtu.be/Ri74aJKk7VQ?si=MYeqbJ_ChzXh14cy" type="video/mp4">
  Your browser does not support HTML5 video.
</video>

<!-- Voting Buttons -->
<div class="vote-buttons">
<button onclick="vote('Mbavu')">🔥 Vote Mbavu</button>
<button onclick="vote('Majembe')">⚡ Vote Majembe</button>
</div>

<p id="vote-message"></p>

<!-- Share Button -->
<button class="share-btn" onclick="shareLink()">Share</button>

<script>
// Voting system with animation
function vote(fighter){
    const msg = document.getElementById('vote-message');
    msg.innerText = `You voted for ${fighter}!`;
    msg.classList.add('vote-anim');
    setTimeout(()=>msg.classList.remove('vote-anim'), 400);
}

// Share on WhatsApp
function shareLink(){
    const url = window.location.href;
    const message = `Check out Mbavu vs Majembe fight! Watch and vote: ${url}`;
    const whatsappURL = `https://wa.me/?text=${encodeURIComponent(message)}`;
    window.open(whatsappURL,"_blank");
}
</script>

</body>
</html>
