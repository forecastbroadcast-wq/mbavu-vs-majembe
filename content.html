<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mbavu vs Majembe Fight Arena</title>
<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: #111;
    color:white;
    text-align:center;
}

header{
    background: url('https://i.ibb.co/zhZH3wxC/5a4eb419-5568-4a68-a8cb-24ca80846bfb.jpg') no-repeat center center;
    background-size: cover;
    height: 50vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-shadow:2px 2px 10px black;
    position: relative;
}

/* Dark overlay for readability */
header::before {
    content: "";
    position: absolute;
    top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.5);
}

header h1{
    font-size:3rem;
    position: relative;
}

/* Video Section as floating square above header */
.video-container{
    width:90%;
    max-width:500px;
    margin:auto;
    position: relative;
    top: -100px; /* float above header */
    padding:10px;
    border-radius:15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    background: #000; /* black background for video card */
}

.video-container iframe{
    width:100%;
    aspect-ratio:1/1; /* make it square */
    border-radius:15px;
}

/* Container */
.container{
    padding:30px;
    max-width:900px;
    margin:auto;
}

/* Voting Buttons */
.vote-buttons{
    margin-top:20px;
}

.vote-buttons button{
    padding:15px 25px;
    margin:10px;
    background:#e50914;
    border:none;
    color:white;
    font-size:18px;
    cursor:pointer;
    border-radius:6px;
    transition:0.3s;
}

.vote-buttons button:hover{
    background:#ff2a2a;
}

#vote-message{
    margin-top:15px;
    font-size:1.2rem;
    color:#ffcc00;
    min-height:1.5em;
}

.vote-anim{
    animation: pop 0.4s ease-out;
}

@keyframes pop{
    0% { transform: scale(1); color:#ffcc00; }
    50% { transform: scale(1.5); color:#fff; }
    100% { transform: scale(1); color:#ffcc00; }
}

/* Galleries */
.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:30px;
}

.gallery img{
    width:150px;
    height:150px;
    object-fit:cover;
    margin:10px;
    border:2px solid #e50914;
    border-radius:10px;
    transition: transform 0.3s;
}

.gallery img:hover{
    transform: scale(1.1);
}

.gallery-title{
    font-size:1.5rem;
    margin-top:20px;
    margin-bottom:10px;
    text-decoration: underline;
}

/* Share button */
.share-btn{
    position:fixed;
    bottom:20px;
    right:20px;
    padding:12px 20px;
    background:green;
    border:none;
    color:white;
    font-size:16px;
    cursor:pointer;
    border-radius:50px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
}

@media(max-width:600px){
    header h1{font-size:2rem;}
    .vote-buttons button{padding:12px 18px;font-size:16px;}
    .gallery img{width:100px; height:100px;}
    .video-container{
        top:-80px;
    }
    .video-container iframe{
        aspect-ratio:1/1;
    }
}
</style>
</head>
<body>

<header>
<h1>🔥 MBAVU VS MAJEMBE 🔥</h1>
</header>

<!-- VIDEO ON TOP AS FLOATING SQUARE -->
<div class="video-container">
  <iframe src="https://www.youtube.com/embed/Ri74aJKk7VQ?rel=0" 
          title="Mbavu vs Majembe Fight"
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
  </iframe>
</div>

<div class="container">
<p>Welcome to the fight arena! Watch, vote, and share your favorite fighter!</p>

<!-- Voting Buttons -->
<div class="vote-buttons">
<button onclick="vote('Mbavu')">🔥 Vote Mbavu</button>
<button onclick="vote('Majembe')">⚡ Vote Majembe</button>
</div>

<p id="vote-message"></p>

<!-- Galleries -->
<div class="gallery-section">
    <div class="gallery-title">Mbavu Gallery</div>
    <div class="gallery" id="mbavu-gallery">
        <img src="https://i.ibb.co/bRJn5Gjv/cec8d3a3-900b-4fd8-ba72-2ffc30000891.jpg" alt="Mbavu 1">
        <img src="https://i.ibb.co/FkY2fS6P/d29f7d0c-a43a-43f9-a3f6-2c5eae7fe3da.jpg" alt="Mbavu 2">
        <img src="https://i.ibb.co/jvJLQ4gP/982a0dd4-bdc1-4f8e-bb0f-9941b10df00e.jpg" alt="Mbavu 3">
    </div>

    <div class="gallery-title">Majembe Gallery</div>
    <div class="gallery" id="majembe-gallery">
        <img src="https://i.ibb.co/zHsh7HxH/70a6220c-e81d-417d-b049-c0986a2c3faa.jpg" alt="Majembe 1">
        <img src="https://i.ibb.co/5g52xMvy/f46baafb-9cf2-4cd4-8a53-0ea046612262.jpg" alt="Majembe 2">
        <img src="https://i.ibb.co/k29hZsZq/89552ced-22a0-4ea8-92f9-eef81837aa4b.jpg" alt="Majembe 3">
    </div>
</div>

<!-- Share Button -->
<button class="share-btn" onclick="shareLink()">Share</button>

<script>
// Voting system with animation
function vote(fighter){
    const msg = document.getElementById('vote-message');
    msg.innerText = `You voted for ${fighter}!`;
    msg.classList.add('vote-anim');
    setTimeout(()=>msg.classList.remove('vote-anim'), 400);
}

// Share on WhatsApp
function shareLink(){
    const url = window.location.href;
    const message = `Check out Mbavu vs Majembe fight! Watch and vote: ${url}`;
    const whatsappURL = `https://wa.me/?text=${encodeURIComponent(message)}`;
    window.open(whatsappURL,"_blank");
}
</script>

</body>
</html>
